services:
  web:
    build: .
    image: shenyuan-law-firm:latest
    ports:
      # 生产本地定制：只绑定本机回环地址，由 Caddy 反向代理对外提供 HTTPS。
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      # Bearer token for GET /admin/intakes.csv. Set a strong value in the
      # .env file next to this compose file (or in 1Panel's app settings).
      # Empty/unset = admin export disabled.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Webhook URL for new-intake alerts (WeChat Work group bot, etc.).
      # Empty/unset = notifications disabled.
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      # Resend API for the client auto-reply email. Empty/unset = no auto-reply.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-no-reply@shenyuanlegal.com}
      # Public base URL for canonical/OG/sitemap links.
      SITE_URL: ${SITE_URL:-https://your-domain.example.com}
      # Google Analytics 4 measurement ID (G-XXXXXXX). Empty/unset = no tag.
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
    volumes:
      # 生产本地定制：bind mount，数据在 /opt/shenyuan-law-firm/data，便于备份。
      - ./data:/app/data
    restart: unless-stopped

volumes:
  {}
