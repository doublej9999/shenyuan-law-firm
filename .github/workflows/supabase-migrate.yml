name: Supabase Migrations

# Branch -> environment mapping.
#
#   main -> production: Supabase project jaevfeneyjcvljwgmfxv, Vercel Production
#   dev  -> preview:    Supabase project hgfwoisbjdojnrleenfp (shenyuan-preview), Vercel Preview
#
# Application deploys are handled by Vercel's native Git integration:
#   push to main -> Production (shenyuanlegal.com)
#   push to dev  -> Preview    (preview.shenyuanlegal.com, preview-admin.shenyuanlegal.com,
#                               preview-api.shenyuanlegal.com)
#
# Database migrations stay separate so the isolated preview project never writes to production data.
on:
  push:
    branches: [main, dev]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:

concurrency:
  group: supabase-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate-production:
    name: Push DB Migrations (production)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push to production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets are required."
            exit 1
          fi
          supabase link --project-ref jaevfeneyjcvljwgmfxv --password "$SUPABASE_DB_PASSWORD"
          supabase db push
          supabase migration list

  migrate-preview:
    name: Push DB Migrations (preview)
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push to shenyuan-preview project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PREVIEW_DB_URL: ${{ secrets.SUPABASE_PREVIEW_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PREVIEW_DB_URL:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PREVIEW_DB_URL repository secrets are required."
            exit 1
          fi
          # The preview project's postgres superuser password is not available to CI,
          # so connect with the dedicated shenyuan_app role via an explicit db-url.
          supabase migration list --db-url "$SUPABASE_PREVIEW_DB_URL"
          supabase db push --db-url "$SUPABASE_PREVIEW_DB_URL"
