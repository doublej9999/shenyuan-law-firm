name: Supabase Migrations

# 数据库迁移只在生产分支 (main) 上执行，避免预览环境污染共享数据库。
# 应用部署（backend / frontend-web / frontend-admin）由 Vercel 原生 Git 集成负责：
#   - push 到 main  -> Production 部署（shenyuanlegal.com）
#   - push 到 dev   -> Preview   部署（shenyuan-web-git-dev-doub.vercel.app）
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:

concurrency:
  group: supabase-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Push DB Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase DB Push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref jaevfeneyjcvljwgmfxv --password "$SUPABASE_DB_PASSWORD"
            supabase db push
          else
            echo "Supabase credentials not configured in secrets. Skipping."
          fi
