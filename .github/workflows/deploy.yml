name: Auto Deploy on Push

on:
  push:
    branches:
      - refactor/django-vue-supabase

jobs:
  deploy-supabase:
    name: Supabase DB Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase DB Push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != ''
        run: |
          supabase link --project-ref jaevfeneyjcvljwgmfxv --password "$SUPABASE_DB_PASSWORD"
          supabase db push

  deploy-render:
    name: Render Django Backend
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"

  deploy-frontend-web:
    name: Vercel Frontend Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend-web/pnpm-lock.yaml'

      - name: Install Dependencies & Build
        working-directory: frontend-web
        run: |
          pnpm install
          pnpm run build

      - name: Deploy to Vercel
        working-directory: frontend-web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        if: env.VERCEL_TOKEN != ''
        run: |
          npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"

  deploy-frontend-admin:
    name: Vercel Frontend Admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend-admin/pnpm-lock.yaml'

      - name: Install Dependencies & Build
        working-directory: frontend-admin
        run: |
          pnpm install
          pnpm run build

      - name: Deploy to Vercel
        working-directory: frontend-admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        if: env.VERCEL_TOKEN != ''
        run: |
          npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"
