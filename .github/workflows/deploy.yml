name: Auto Deploy on Push

on:
  push:
    branches:
      - refactor/django-vue-supabase

jobs:
  deploy-supabase:
    name: Supabase DB Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase DB Push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref jaevfeneyjcvljwgmfxv --password "$SUPABASE_DB_PASSWORD"
            supabase db push
          else
            echo "Supabase credentials not configured in secrets. Skipping."
          fi

  deploy-render:
    name: Render Django Backend
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "Render deploy hook URL not configured. (Render will use native Git Auto-Deploy on commit push)."
          fi

  deploy-frontend-web:
    name: Vercel Frontend Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend-web/pnpm-lock.yaml'

      - name: Install Dependencies & Build
        working-directory: frontend-web
        run: |
          pnpm install
          pnpm run build

      - name: Deploy to Vercel
        working-directory: frontend-web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          else
            echo "VERCEL_TOKEN not detected in secrets. Skipping Vercel deploy."
          fi

  deploy-frontend-admin:
    name: Vercel Frontend Admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend-admin/pnpm-lock.yaml'

      - name: Install Dependencies & Build
        working-directory: frontend-admin
        run: |
          pnpm install
          pnpm run build

      - name: Deploy to Vercel
        working-directory: frontend-admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          else
            echo "VERCEL_TOKEN not detected in secrets. Skipping Vercel deploy."
          fi
