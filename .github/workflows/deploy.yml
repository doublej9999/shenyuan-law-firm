name: Auto Deploy on Push

on:
  push:
    branches:
      - refactor/django-vue-supabase

jobs:
  deploy-supabase:
    name: Supabase DB Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase DB Push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref jaevfeneyjcvljwgmfxv --password "$SUPABASE_DB_PASSWORD"
            supabase db push
          else
            echo "Supabase credentials not configured in secrets. Skipping."
          fi

  deploy-backend:
    name: Vercel Django Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies & Verify Build
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py check

      - name: Deploy Backend to Vercel
        working-directory: backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_baQbEk5gnm89oRwBuZzA7ppi
          VERCEL_PROJECT_ID: prj_iamR9IxRt5FC5wZDgfjQmQVz49Zn
        run: |
          echo "Checking VERCEL_TOKEN length: ${#VERCEL_TOKEN}"
          if [ -n "$VERCEL_TOKEN" ]; then
            npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          else
            echo "VERCEL_TOKEN not detected in secrets. Skipping Vercel deploy."
          fi

  deploy-frontend-web:
    name: Vercel Frontend Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend-web/pnpm-lock.yaml'

      - name: Install Dependencies & Build
        working-directory: frontend-web
        run: |
          pnpm install
          pnpm run build

      - name: Deploy to Vercel
        working-directory: frontend-web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_baQbEk5gnm89oRwBuZzA7ppi
          VERCEL_PROJECT_ID: prj_m8JgVn2LrsKnibdyhl9UQ1a5VD1c
        run: |
          echo "Checking VERCEL_TOKEN length: ${#VERCEL_TOKEN}"
          if [ -n "$VERCEL_TOKEN" ]; then
            npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          else
            echo "VERCEL_TOKEN not detected in secrets. Skipping Vercel deploy."
          fi

  deploy-frontend-admin:
    name: Vercel Frontend Admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend-admin/pnpm-lock.yaml'

      - name: Install Dependencies & Build
        working-directory: frontend-admin
        run: |
          pnpm install
          pnpm run build

      - name: Deploy to Vercel
        working-directory: frontend-admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_baQbEk5gnm89oRwBuZzA7ppi
          VERCEL_PROJECT_ID: prj_tvXHzFOyEXD2ogO9q39t6QRNNfHa
        run: |
          echo "Checking VERCEL_TOKEN length: ${#VERCEL_TOKEN}"
          if [ -n "$VERCEL_TOKEN" ]; then
            npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          else
            echo "VERCEL_TOKEN not detected in secrets. Skipping Vercel deploy."
          fi
