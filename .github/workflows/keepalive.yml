name: Keep-Alive Vercel Backend

on:
  schedule:
    # 每天北京时间 08:00 - 24:00 (UTC 00:00 - 16:00)，每 10 分钟 ping 一次维持热实例保活
    - cron: '*/10 0-16 * * *'
  workflow_dispatch: # 支持手动点击触发

jobs:
  ping:
    name: Ping Backend Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://shenyuan-backend.vercel.app/api/health")
          echo "Health check status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Backend instance successfully kept warm!"
