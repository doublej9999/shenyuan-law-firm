<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容管理 · Shenyuan</title>
<style>body{font:14px system-ui;margin:0;background:#f4f1ea;color:#172433}header{background:#084d50;color:#fff;padding:16px 24px}main{max-width:1200px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:280px 1fr;gap:18px}.panel{background:#fffdf9;border:1px solid #ddd8cc;border-radius:10px;padding:16px}input,textarea,select{width:100%;box-sizing:border-box;margin:6px 0 12px;padding:9px;border:1px solid #c9c5ba;border-radius:6px}textarea{min-height:180px;font-family:ui-monospace,monospace}.row{display:flex;gap:8px}.row>*{flex:1}button{padding:9px 14px;border:0;border-radius:6px;background:#0d6c6b;color:white;cursor:pointer;margin:3px}button.secondary{background:#6b7280}.item{padding:10px;border-bottom:1px solid #eee;cursor:pointer}.item:hover{background:#f1f7f5}.status{float:right;color:#996b22}.notice{padding:8px;color:#0d6c6b}</style></head>
<body><header><strong>📝 内容管理</strong>　<a href="/admin" style="color:#fff">返回后台</a></header><main><div id="login" class="panel"><label>后台 Token</label><input id="token" type="password"><button onclick="saveToken()">进入</button></div><div id="app" hidden><div class="row"><button onclick="newDraft()">+ 新建草稿</button><button onclick="loadList()" class="secondary">刷新</button><span id="msg" class="notice"></span></div><div class="grid"><div class="panel"><h3>文章</h3><div id="list"></div></div><div class="panel"><div class="row"><div><label>中文标题</label><input id="title_zh"></div><div><label>English title</label><input id="title_en"></div></div><div class="row"><div><label>Slug</label><input id="slug"></div><div><label>状态</label><select id="status"><option>draft</option><option>review</option><option>published</option><option>archived</option></select></div></div><div class="row"><div><label>中文 SEO 描述</label><textarea id="description_zh" style="min-height:70px"></textarea></div><div><label>English SEO description</label><textarea id="description_en" style="min-height:70px"></textarea></div></div><div class="row"><div><label>中文正文</label><textarea id="body_zh"></textarea></div><div><label>English body</label><textarea id="body_en"></textarea></div></div><div><label>业务线</label><select id="business"><option>trade</option><option>recovery</option><option>legacy</option><option>general</option></select> <label>意图</label><select id="intent"><option>I</option><option>C</option><option>T</option></select></div><button onclick="save()">保存草稿</button><button onclick="preview()" class="secondary">预览</button><button onclick="publish()">发布</button><div id="preview"></div></div></div></div></main>
<script>
const $=id=>document.getElementById(id);let id=null;const fields=['title_zh','title_en','slug','description_zh','description_en','body_zh','body_en','business','intent','status'];
function auth(){return {Authorization:'Bearer '+sessionStorage.cmsToken,'Content-Type':'application/json'}}
function saveToken(){sessionStorage.cmsToken=$('token').value;$('login').hidden=true;$('app').hidden=false;loadList()}
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{...auth(),...(opt.headers||{})}});if(r.status===401){sessionStorage.removeItem('cmsToken');$('login').hidden=false;$('app').hidden=true;throw Error('认证失败')}return r}
async function loadList(){let r=await api('/admin/api/content');let d=await r.json();$('list').innerHTML=d.items.map(x=>`<div class=item onclick="load(${x.id})">${x.title_zh||'(无标题)'} <span class=status>${x.status}</span></div>`).join('')||'<p>暂无内容</p>'}
async function load(n){id=n;let d=await (await api('/admin/api/content/'+n)).json();fields.forEach(k=>{if($(k))$(k).value=d[k]??''});$('msg').textContent='已载入'}
function newDraft(){id=null;fields.forEach(k=>{if($(k))$(k).value=k==='status'?'draft':k==='business'?'trade':k==='intent'?'I':''});$('msg').textContent='新草稿'}
function payload(){let p={};fields.forEach(k=>p[k]=$(k).value);return p}
async function save(){let r=await api(id?'/admin/api/content/'+id:'/admin/api/content',{method:id?'PUT':'POST',body:JSON.stringify(payload())});let d=await r.json();if(!id)id=d.id;$('msg').textContent='已保存';loadList()}
async function preview(){if(!id)await save();let r=await api('/admin/api/content/'+id+'/preview');$('preview').innerHTML='<hr><h3>预览</h3>'+await r.text()}
async function publish(){if(!id)await save();if(!confirm('确认发布？'))return;let r=await api('/admin/api/content/'+id+'/publish',{method:'POST'});let d=await r.json();$('status').value=d.status;$('msg').textContent='已发布：'+location.origin+'/articles/'+d.slug;loadList()}
</script></body></html>
